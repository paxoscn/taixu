[package]
name = "taixu"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "General-purpose, embeddable game backend building blocks"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/paxoscn/taixu"
homepage = "https://github.com/paxoscn/taixu"
documentation = "https://docs.rs/taixu"
keywords = ["game", "backend", "server", "inventory", "leaderboard"]
categories = ["game-engines"]

[dependencies]
async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
